<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonne Anniversaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Pixelify Sans','Courier New',monospace;color:#8b1f3a;
  background:linear-gradient(100deg,#fbd0da 0%,#fde6e2 38%,#fdf0e2 100%)}
#stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.s1{cursor:crosshair}
.scene{position:absolute;inset:0;transition:opacity .5s,transform .5s}
#s2{display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
#s2.show{opacity:1;pointer-events:auto}
#s1.out{opacity:0;transform:scale(.96);pointer-events:none}

/* floating hearts */
.fh{position:fixed;color:#e8405f;opacity:0;pointer-events:none;animation:fl linear infinite}
@keyframes fl{0%{transform:translate(0,0);opacity:0}15%,85%{opacity:var(--o)}100%{transform:translate(var(--dx),-140px);opacity:0}}

/* scene 1 */
#env{position:absolute;left:50%;top:13%;width:160px;margin-left:-80px}
#env svg{width:100%;display:block;filter:drop-shadow(0 6px 10px rgba(232,96,122,.18))}
#env.hit{animation:hit .7s}
@keyframes hit{0%{transform:scale(1)}25%{transform:scale(1.12) rotate(-5deg)}50%{transform:scale(1.05) rotate(4deg)}100%{transform:scale(1.2);opacity:0}}
#cap{position:absolute;left:0;right:0;top:calc(13% + 132px);text-align:center;font-size:15px;font-weight:600;color:#a02848}
#cap b{color:#e0324f;font-size:12px;margin:0 6px}
#hint{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:12px;color:#a85468;opacity:.85}
#bowWrap{position:absolute;left:50%;top:66%;width:0;height:0}
#bow{position:absolute;left:-60px;top:-50px;overflow:visible}
.arrowFly{position:fixed;width:12px;height:70px;transform-origin:50% 0;pointer-events:none;overflow:visible}

/* scene 2 */
.win{width:min(330px,88vw);border:3px solid #f08aa3;border-radius:6px;background:#fbc9d6;
  box-shadow:0 14px 34px rgba(240,100,140,.28);transform:scale(.9);transition:transform .5s cubic-bezier(.2,1.4,.4,1),box-shadow .6s}
#s2.show .win{transform:scale(1)}
.win.happy{box-shadow:0 0 50px 14px rgba(255,120,160,.55)}
.title{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:12px;font-weight:700;background:#f9b0c3;letter-spacing:.5px}
.title span{display:flex;gap:5px}
.title i{width:14px;height:14px;border:2px solid #e8728f;background:#fde3ea;display:block}
.bar{background:#fdd9e2;text-align:center;font-size:11px;color:#e0324f;padding:6px;border-top:2px solid #f08aa3;border-bottom:2px solid #f08aa3;letter-spacing:3px}
.body{position:relative;padding:26px 18px 24px;text-align:center;
  background:linear-gradient(90deg,rgba(255,255,255,.32) 50%,transparent 50%),
             linear-gradient(rgba(255,255,255,.32) 50%,transparent 50%),#f7a9be;
  background-size:16px 16px}
h2{font-size:21px;line-height:1.3;font-weight:700;color:#8b1f3a}
#cat{display:block;margin:20px auto 18px;width:112px;height:98px;image-rendering:pixelated}
#cat.wig{animation:wig .5s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-7deg) scale(1.04)}50%{transform:rotate(7deg) scale(.98)}}
.btns{display:flex;justify-content:center;gap:12px;min-height:40px}
.btn{font:inherit;font-weight:700;font-size:13px;padding:8px 20px;border:2px solid #f08aa3;background:#fff7f3;color:#7a2a3d;
  border-radius:4px;box-shadow:0 3px 0 #e08aa0;cursor:pointer;transition:background .15s,color .15s,transform .1s}
#yes{font-size:15px;padding:9px 24px}
#yes:hover{background:#f0657f;color:#fff}
#yes:active{transform:translateY(2px);box-shadow:0 1px 0 #e08aa0}
#no.free{position:absolute;padding:5px 12px;font-size:11px;transition:left .28s ease,top .28s ease}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="stage" class="s1">
  <!-- Scene 1: envelope + bow -->
  <div id="s1" class="scene">
    <div id="env">
      <svg viewBox="0 0 150 108" shape-rendering="crispEdges">
        <rect x="2" y="2" width="146" height="104" rx="4" fill="#fdeef0" stroke="#e8607a" stroke-width="3"/>
        <path d="M4 104 L62 50 M146 104 L88 50" stroke="#f3a3b4" stroke-width="2" fill="none"/>
        <path d="M4 4 L75 56 L146 4 Z" fill="#f9bccb" stroke="#e8607a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M75 62 C60 50 64 40 75 46 C86 40 90 50 75 62Z" fill="#e0324f" transform="translate(0,-6)"/>
      </svg>
    </div>
    <div id="cap"><b>♥</b>Bonne Anniversaire<b>♥</b></div>
    <div id="bowWrap">
      <svg id="bow" width="120" height="90" viewBox="0 0 120 90">
        <g id="arrow">
          <line x1="60" y1="30" x2="60" y2="-28" stroke="#c0455c" stroke-width="2.5"/>
          <polygon points="60,-42 53,-26 67,-26" fill="#e0324f"/>
          <path d="M60 30 l-6 8 M60 30 l6 8 M60 38 l-5 7 M60 38 l5 7" stroke="#e0324f" stroke-width="2" fill="none"/>
        </g>
        <polyline id="str" points="6,30 60,30 114,30" stroke="#b98a5a" stroke-width="1.5" fill="none"/>
        <path d="M6 30 Q60 70 114 30" stroke="#c98a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="50" y="46" width="20" height="8" rx="2" fill="#9a5f1f" stroke="#7a4814" stroke-width="1"/>
      </svg>
    </div>
    <div id="hint">Giữ mũi tên – thả để bắn ♡ ♥</div>
  </div>

  <!-- Scene 2: LOVE window -->
  <div id="s2" class="scene">
    <div class="win" id="win">
      <div class="title">LOVE<span><i></i><i></i><i></i></span></div>
      <div class="bar">♥ · ♥ · ♥</div>
      <div class="body" id="body">
        <h2 id="msg">1 tháng rùi đó vỢ ♡ Còn iu a chứuu?</h2>
        <canvas id="cat" width="16" height="14"></canvas>
        <div class="btns" id="btns">
          <button class="btn" id="yes">CÓ</button>
          <button class="btn" id="no">KHÔNG</button>
        </div>
      </div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const stage = $('#stage'), s1 = $('#s1'), s2 = $('#s2'), env = $('#env');
const bowWrap = $('#bowWrap'), arrowG = $('#arrow'), str = $('#str');

/* ---------- ambient floating hearts ---------- */
for (let i = 0; i < 34; i++) {
  const h = document.createElement('span');
  h.className = 'fh'; h.textContent = '♥';
  h.style.cssText = `left:${rand(0,100)}%;top:${rand(0,100)}%;font-size:${rand(6,15)}px;` +
    `--o:${rand(.35,.85)};--dx:${rand(-60,60)}px;animation-duration:${rand(8,16)}s;animation-delay:${-rand(0,16)}s;` +
    `color:${Math.random()<.5?'#e8405f':'#f48fa8'}`;
  document.body.appendChild(h);
}

/* ---------- pixel cat ---------- */
(function drawCat() {
  const rows = [
    ".BB..........BB.",
    ".BBB........BBB.",
    ".BBBBBBBBBBBBBB.",
    "BBBBBBBBBBBBBBBB",
    "BBWWWWBBBBWWWWBB",
    "BBWWBBBBBBWWBBBB",
    "BBBBBBBBBBBBBBBB",
    "BBBBBBBBBBBBBBBB",
    "BBBBRRBBBBRRBBBB",
    "BBBRRRRRRRRRRBBB",
    "BBBRRRRRRRRRRBBB",
    ".BBBRRRRRRRRBBB.",
    "..BBBBRRRRBBBB..",
    "..BBBBBRRBBBBB.."
  ];
  const col = { B: '#1b1415', W: '#ffffff', R: '#ee2e4f' };
  const c = $('#cat').getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    if (col[ch]) { c.fillStyle = col[ch]; c.fillRect(x, y, 1, 1); }
  }));
})();

/* ---------- heart particles ---------- */
const fx = $('#fx'), cx = fx.getContext('2d');
let P = [];
function sizeFx() { fx.width = innerWidth; fx.height = innerHeight; }
sizeFx(); addEventListener('resize', sizeFx);
const palette = ['#ff6b8b', '#e0324f', '#ffa3b8', '#c3a6ff', '#ffd66b', '#ffb067', '#ff8fb0'];
function burst(x, y, n, big) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(2, big ? 13 : 7);
    P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - rand(2, 6), g: .22, rot: rand(0, 6), vr: rand(-.1, .1),
      s: big ? rand(14, 34) : rand(8, 16), c: palette[(Math.random() * palette.length) | 0], life: 1, d: rand(.006, .014) });
  }
}
function heartPath(c, s) {
  c.beginPath(); c.moveTo(0, s * .35);
  c.bezierCurveTo(-s * .65, -s * .05, -s * .5, -s * .6, 0, -s * .22);
  c.bezierCurveTo(s * .5, -s * .6, s * .65, -s * .05, 0, s * .35); c.fill();
}
(function loop() {
  cx.clearRect(0, 0, fx.width, fx.height);
  P = P.filter(p => p.life > 0 && p.y < fx.height + 60);
  for (const p of P) {
    p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.d;
    cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
    cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; heartPath(cx, p.s); cx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ---------- bow & arrow ---------- */
let mx = innerWidth / 2, my = 0, pulling = false, pull = 0, t0 = 0, rot = 0, opened = false;
const pivot = () => { const r = bowWrap.getBoundingClientRect(); return { x: r.left, y: r.top }; };
function aim() {
  const p = pivot();
  let r = Math.atan2(my - p.y, mx - p.x) + Math.PI / 2;
  if (r > Math.PI) r -= Math.PI * 2;
  rot = Math.max(-1.45, Math.min(1.45, r));
  bowWrap.style.transform = `rotate(${rot}rad)`;
}
function drawPull() {
  const d = pull * 20;
  arrowG.setAttribute('transform', `translate(0,${d})`);
  str.setAttribute('points', `6,30 60,${30 + d} 114,30`);
}
stage.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; if (!opened) aim(); });
stage.addEventListener('pointerdown', e => {
  if (opened) return;
  mx = e.clientX; my = e.clientY; aim(); pulling = true; t0 = performance.now();
});
addEventListener('pointerup', () => { if (pulling && !opened) shoot(); pulling = false; pull = 0; drawPull(); });
(function tick(now) {
  if (pulling) { pull = Math.min(1, (now - t0) / 800); drawPull(); }
  requestAnimationFrame(tick);
})(0);

function shoot() {
  const ang = rot - Math.PI / 2, dx = Math.cos(ang), dy = Math.sin(ang);
  const p = pivot(), speed = 12 + pull * 14;
  let x = p.x + dx * 30, y = p.y + dy * 30;
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  el.setAttribute('class', 'arrowFly'); el.setAttribute('viewBox', '0 0 12 70');
  el.innerHTML = '<polygon points="6,0 0,14 12,14" fill="#e0324f"/><line x1="6" y1="14" x2="6" y2="70" stroke="#c0455c" stroke-width="2.5"/>' +
    '<path d="M6 70 l-5 -8 M6 70 l5 -8" stroke="#e0324f" stroke-width="2" fill="none"/>';
  el.style.transform = `rotate(${rot}rad)`;
  document.body.appendChild(el);
  (function fly() {
    x += dx * speed; y += dy * speed;
    el.style.left = (x - 6) + 'px'; el.style.top = y + 'px';
    const r = env.getBoundingClientRect();
    if (!opened && x > r.left - 6 && x < r.right + 6 && y > r.top - 6 && y < r.bottom + 6) {
      opened = true; el.style.transition = 'opacity .4s'; el.style.opacity = 0;
      setTimeout(() => el.remove(), 400); return openEnvelope();
    }
    if (x < -120 || x > innerWidth + 120 || y < -120 || y > innerHeight + 120) return el.remove();
    requestAnimationFrame(fly);
  })();
}

function openEnvelope() {
  const r = env.getBoundingClientRect();
  env.classList.add('hit');
  burst(r.left + r.width / 2, r.top + r.height / 2, 24, false);
  setTimeout(() => {
    s1.classList.add('out'); stage.classList.remove('s1');
    s2.classList.add('show');
    const w = $('#win').getBoundingClientRect();
    burst(w.left + w.width / 2, w.top + w.height / 2, 14, false);
  }, 650);
}

/* ---------- NO button runs away ---------- */
const no = $('#no'), yes = $('#yes'), body = $('#body');
function dodge(e) {
  if (e) e.preventDefault();
  const b = body.getBoundingClientRect(), n = no.getBoundingClientRect();
  if (!no.classList.contains('free')) {
    no.style.transition = 'none';
    no.style.left = (n.left - b.left) + 'px'; no.style.top = (n.top - b.top) + 'px';
    no.classList.add('free'); void no.offsetWidth; no.style.transition = '';
  }
  const nw = no.offsetWidth, nh = no.offsetHeight, y = yes.getBoundingClientRect();
  let X, Y, ok = false;
  for (let i = 0; i < 30 && !ok; i++) {
    X = rand(8, b.width - nw - 8); Y = rand(8, b.height - nh - 8);
    const L = b.left + X, T = b.top + Y;
    const overlapYes = L < y.right + 8 && L + nw > y.left - 8 && T < y.bottom + 8 && T + nh > y.top - 8;
    const farFromPtr = Math.hypot(L + nw / 2 - mx, T + nh / 2 - my) > 90;
    ok = !overlapYes && farFromPtr;
  }
  no.style.left = X + 'px'; no.style.top = Y + 'px';
}
no.addEventListener('pointerenter', dodge);
no.addEventListener('pointerdown', dodge);
no.addEventListener('click', e => e.preventDefault());

/* ---------- YES ---------- */
yes.addEventListener('click', () => {
  $('#msg').textContent = 'A biết mà, iu vợ nhìuuuu ♡';
  $('#btns').style.display = 'none'; no.style.display = 'none';
  $('#cat').classList.add('wig'); $('#win').classList.add('happy');
  const go = () => {
    const w = $('#win').getBoundingClientRect();
    burst(w.left + w.width / 2, w.top + w.height * .6, 10, true);
    burst(rand(0, innerWidth), innerHeight + 10, 3, true);
  };
  go(); let n = 0;
  const t = setInterval(() => { go(); if (++n > 26) { clearInterval(t); setInterval(go, 900); } }, 110);
});
</script>
</body>
</html>
